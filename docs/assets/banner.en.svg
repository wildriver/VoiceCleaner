<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1023"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#card)"/>
  <rect width="1280" height="420" rx="28" fill="url(#dots)"/>
  <svg x="70" y="60" width="300" height="300" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="iwave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="iglow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- macOS-style rounded square with margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ibg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#iglow)"/>
  <!-- noisy part: scattered short bars, faded -->
  <g fill="#FFFFFF" opacity="0.28">
    <rect x="214" y="470" width="22" height="84" rx="11"/>
    <rect x="252" y="430" width="22" height="164" rx="11"/>
    <rect x="290" y="488" width="22" height="48" rx="11"/>
    <rect x="328" y="410" width="22" height="204" rx="11"/>
    <rect x="366" y="456" width="22" height="112" rx="11"/>
  </g>
  <!-- divider sparkle -->
  <path d="M452 512 l18 -46 18 46 46 18 -46 18 -18 46 -18 -46 -46 -18z" fill="#FFFFFF" opacity="0.95"/>
  <!-- clean part: smooth waveform bars -->
  <g fill="url(#iwave)">
    <rect x="560" y="452" width="30" height="120" rx="15"/>
    <rect x="610" y="382" width="30" height="260" rx="15"/>
    <rect x="660" y="322" width="30" height="380" rx="15"/>
    <rect x="710" y="402" width="30" height="220" rx="15"/>
    <rect x="760" y="462" width="30" height="100" rx="15"/>
  </g>
</svg>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif">
    <text x="410" y="190" font-size="92" font-weight="700" fill="url(#title)" letter-spacing="-1.5">VoiceCleaner</text>
    <text x="414" y="252" font-size="32" font-weight="500" fill="#C7D2FE">Clear voices in your videos — just drop the file.</text>
    <text x="414" y="306" font-size="22" fill="#94A3B8">NVIDIA RE-USE · 48 kHz Stereo · On-device · Apple Silicon</text>
  </g>
</svg>
