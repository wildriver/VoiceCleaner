name: REUSECleaner
options:
  bundleIdPrefix: io.github.wildriver
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  REUSECleaner:
    path: .
targets:
  RE-USE Cleaner:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/Notices.txt
        buildPhase: resources
    dependencies:
      - package: REUSECleaner
        product: CleanerCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RE-USE Cleaner
        CFBundleName: RE-USE Cleaner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Code: Apache-2.0. Model: NVIDIA RE-USE, OpenMDW-1.1."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.audio]
    settings:
      base:
        PRODUCT_NAME: RE-USE Cleaner
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wildriver.reuse-cleaner
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
