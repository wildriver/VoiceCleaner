name: VoiceCleaner
options:
  bundleIdPrefix: io.github.wildriver
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  VoiceCleanerKit:
    path: .
targetTemplates:
  App:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/Notices.txt
        buildPhase: resources
    dependencies:
      - package: VoiceCleanerKit
        product: CleanerCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VoiceCleaner
        CFBundleName: VoiceCleaner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "15.0"
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Code: Apache-2.0. Model: NVIDIA RE-USE, OpenMDW-1.1."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.audio]
    settings:
      base:
        PRODUCT_NAME: VoiceCleaner
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wildriver.voicecleaner
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  # Developer ID build for GitHub Releases: downloads the model on first launch.
  VoiceCleaner:
    templates: [App]
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
  # Mac App Store build: sandboxed, ships the model (run scripts/bundle_model.py first).
  VoiceCleanerAppStore:
    templates: [App]
    sources:
      - path: build/REUSEModel
        type: folder
        optional: true
        buildPhase: resources
    entitlements:
      path: App/AppStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LP34H67XY3
